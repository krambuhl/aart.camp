name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    # Successful runs finish in a few minutes; without a timeout a stalled
    # step (e.g. the Playwright browser download) squats a runner for the
    # 6-hour GitHub default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, build, vitest, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Lint (biome)
        if: matrix.task == 'lint'
        run: npm run lint

      - name: Build (next, includes typecheck)
        if: matrix.task == 'build'
        run: npm run build

      - name: Vitest — application
        if: matrix.task == 'vitest'
        run: npm test

      - name: Cache Playwright browsers
        if: matrix.task == 'e2e'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: matrix.task == 'e2e' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (browser cached)
        if: matrix.task == 'e2e' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build Storybook
        if: matrix.task == 'e2e'
        run: npm run build-storybook

      - name: Playwright tests
        if: matrix.task == 'e2e'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure() && matrix.task == 'e2e'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
